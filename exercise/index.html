<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            margin: 0 1rem;
        }

        h1 {
            font-size: 1.33rem;
            font-weight: normal;
            margin: 0 0 1rem 0;
            color: #999999;
        }

        #exerciseTime {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }

        .date {
            color: #999999;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Today's Exercise Time</h1>
        <div id="exerciseTime"></div>
        <div class="date" id="date"></div>
    </div>

    <script>
        // Set the reference date (when you did morning exercise)
        const referenceDate = new Date('2024-06-04'); // Today is morning exercise
        const today = new Date();

        // Calculate days difference
        const diffTime = Math.abs(today - referenceDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        // Determine if it's morning or evening based on even/odd days
        const isMorning = diffDays % 2 === 0;

        // Update the display
        document.getElementById('exerciseTime').textContent = isMorning ? 'Morning' : 'Evening';
        document.getElementById('date').textContent = today.toLocaleDateString();
    </script>
</body>

</html>
